# Web portal (HR / Admin / Manager), deployed as a static export.
# Auto-deploy: connect this GitHub repo in Netlify (Site configuration → Build & deploy →
# Continuous deployment), or use the NETLIFY_BUILD_HOOK GitHub Action secret.
# Required env var: NEXT_PUBLIC_API_URL = https://workpulse-api-pm0x.onrender.com/api/v1
[build]
  base = "web"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # Set in Netlify UI (not here): NEXT_PUBLIC_API_URL=https://workpulse-api-pm0x.onrender.com/api/v1

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
