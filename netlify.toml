# Web portal (HR / Admin / Manager), deployed as a static export.
# The FastAPI backend is deployed separately (see backend/render.yaml); point NEXT_PUBLIC_API_URL at it
# in Netlify > Site configuration > Environment variables, e.g. https://your-api.example.com/api/v1
[build]
  base = "web"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
