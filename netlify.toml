# Web portal (HR / Admin / Manager), deployed as a static export.
# Backend: https://workpulse-api-pm0x.onrender.com (Render). Auto-deploy from GitHub main.
[build]
  base = "web"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_PUBLIC_API_URL = "https://workpulse-api-pm0x.onrender.com/api/v1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Next static export writes /missing-login.html — keep pretty URLs working.
[[redirects]]
  from = "/missing-login"
  to = "/missing-login.html"
  status = 200

[[redirects]]
  from = "/missing-login/"
  to = "/missing-login.html"
  status = 200
