# ==============================================================================
# Enterprise Attendance Platform - Docker Compose Staging Environment (Phase 16)
# ==============================================================================

version: '3.8'

services:
  # 1. PostgreSQL Relational Database (Supabase / Postgres 16)
  postgres:
    image: postgres:16-alpine
    container_name: attendance-postgres-staging
    environment:
      POSTGRES_DB: attendance_staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: StagingPostgresSecurePassword123!
    ports:
      - "5432:5432"
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker & Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: attendance-redis-staging
    ports:
      - "6379:6379"
    volumes:
      - redisdata_staging:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. FastAPI API Gateway
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance-api-staging
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://postgres:StagingPostgresSecurePassword123!@postgres:5432/attendance_staging
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: StagingSecretKeySuperSecureMin32CharactersLong!
      BACKEND_CORS_ORIGINS: '["http://localhost:3000", "http://localhost:8000", "tauri://localhost"]'
      EMAIL_BACKEND: mock
      FRONTEND_BASE_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. Celery Task Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance-worker-staging
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 -Q default,reports,notifications
    environment:
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+asyncpg://postgres:StagingPostgresSecurePassword123!@postgres:5432/attendance_staging
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: StagingSecretKeySuperSecureMin32CharactersLong!
      EMAIL_BACKEND: mock
    depends_on:
      api:
        condition: service_healthy

  # 5. Celery Beat Scheduler
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attendance-beat-staging
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      ENVIRONMENT: staging
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: StagingSecretKeySuperSecureMin32CharactersLong!
    depends_on:
      api:
        condition: service_healthy

  # 6. Next.js Web Dashboard
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: attendance-web-staging
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  pgdata_staging:
  redisdata_staging:
