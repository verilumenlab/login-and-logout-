# ==============================================================================
# Enterprise Attendance Platform - Render Staging Blueprint (Phase 16)
# Defines API Gateway, Celery Worker, Celery Beat Scheduler, and Redis Cache
# ==============================================================================

services:
  # 1. FastAPI Web API Gateway
  - type: web
    name: enterprise-attendance-api-staging
    env: python
    region: oregon
    plan: starter
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false # Connected to Supabase Pooler (e.g. postgresql+asyncpg://postgres:pass@aws-0-us-west-1.pooler.supabase.com:6543/postgres?ssl=require)
      - key: REDIS_HOST
        fromService:
          type: redis
          name: enterprise-attendance-redis-staging
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: enterprise-attendance-redis-staging
          property: port
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["https://magnificent-kangaroo-07d13a.netlify.app", "http://localhost:3000", "tauri://localhost", "http://tauri.localhost", "https://tauri.localhost"]'
      - key: FORWARDED_ALLOW_IPS
        value: "*" # Render only exposes the service through its proxy
      - key: EMAIL_BACKEND
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_BASE_URL
        value: https://magnificent-kangaroo-07d13a.netlify.app

  # 2. Celery Background Worker (Reports, Email, Offline Processing)
  - type: worker
    name: enterprise-attendance-worker-staging
    env: python
    region: oregon
    plan: starter
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 -Q default,reports,notifications
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DATABASE_URL
        fromService:
          type: web
          name: enterprise-attendance-api-staging
          envVarKey: DATABASE_URL
      - key: REDIS_HOST
        fromService:
          type: redis
          name: enterprise-attendance-redis-staging
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: enterprise-attendance-redis-staging
          property: port
      - key: SECRET_KEY
        fromService:
          type: web
          name: enterprise-attendance-api-staging
          envVarKey: SECRET_KEY

  # 3. Celery Beat Scheduler (Daily/Weekly/Monthly Automated Reports)
  - type: worker
    name: enterprise-attendance-beat-staging
    env: python
    region: oregon
    plan: starter
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.core.celery_app beat --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: REDIS_HOST
        fromService:
          type: redis
          name: enterprise-attendance-redis-staging
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: enterprise-attendance-redis-staging
          property: port

  # 4. Managed Redis Service
  - type: redis
    name: enterprise-attendance-redis-staging
    region: oregon
    plan: starter
    ipAllowList: [] # internal networking only
