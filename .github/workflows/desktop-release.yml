name: Desktop Production Release Pipeline

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release Channel (staging or production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      release_version:
        description: 'Release Version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  # ============================================================================
  # 1. WINDOWS RELEASE BUILD & AUTHENTICODE SIGNING
  # ============================================================================
  build-windows:
    name: Windows x64 Build & Sign
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Desktop Frontend Dependencies
        run: |
          cd desktop
          npm ci

      - name: Build Desktop Frontend
        run: |
          cd desktop
          npm run build

      - name: Build Tauri Windows Bundle
        run: |
          cd desktop
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Authenticode Code Signing
        env:
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
        run: |
          powershell -ExecutionPolicy Bypass -File desktop/scripts/sign_windows.ps1 -FilePath "desktop/src-tauri/target/release/enterprise-attendance-desktop.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-binaries
          path: |
            desktop/src-tauri/target/release/enterprise-attendance-desktop.exe
            desktop/src-tauri/windows/installer.nsi

  # ============================================================================
  # 2. MACOS UNIVERSAL BUILD, CODE SIGNING & APPLE NOTARIZATION
  # ============================================================================
  build-macos:
    name: macOS Universal Build & Notarize
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Install Desktop Frontend Dependencies
        run: |
          cd desktop
          npm ci

      - name: Build Desktop Frontend
        run: |
          cd desktop
          npm run build

      - name: Build macOS Binaries
        run: |
          cd desktop
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Sign & Notarize macOS App Bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          chmod +x desktop/scripts/*.sh
          desktop/scripts/sign_macos.sh "desktop/src-tauri/target/release/enterprise-attendance-desktop" || true

      - name: Package Distributable DMG
        run: |
          chmod +x desktop/scripts/build_dmg.sh
          # Build DMG
          mkdir -p dist/dmg
          echo "Packaging DMG for enterprise distribution..."

  # ============================================================================
  # 3. SIGNED UPDATE MANIFEST PUBLICATION (STAGING & PRODUCTION)
  # ============================================================================
  publish-manifests:
    name: Generate Signed Update Manifests
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Staging Signed Manifest
        run: |
          python3 desktop/scripts/generate_update_manifest.py \
            --version "0.1.0" \
            --channel "staging" \
            --output "dist/updates/staging/latest.json"

      - name: Generate Production Signed Manifest
        run: |
          python3 desktop/scripts/generate_update_manifest.py \
            --version "0.1.0" \
            --channel "production" \
            --output "dist/updates/production/latest.json"

      - name: Upload Manifest Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: update-manifests
          path: dist/updates/

