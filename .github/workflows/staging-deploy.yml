name: Staging Continuous Deployment Pipeline

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. TEST & QUALITY GATE
  # ============================================================================
  test-and-lint:
    name: Run Complete Platform Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pytest -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build Web Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Build Desktop Client Frontend
        run: |
          cd desktop
          npm ci
          npm run build

  # ============================================================================
  # 2. DEPLOY BACKEND TO RENDER STAGING
  # ============================================================================
  deploy-backend-staging:
    name: Deploy Backend & Celery Workers to Render
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - name: Trigger Render Staging Deploy Hook
        if: env.RENDER_STAGING_DEPLOY_HOOK != ''
        env:
          RENDER_STAGING_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          curl -X POST "${RENDER_STAGING_DEPLOY_HOOK}"

  # ============================================================================
  # 3. DEPLOY FRONTEND TO VERCEL STAGING
  # ============================================================================
  deploy-frontend-staging:
    name: Deploy Web Portal to Vercel Staging
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Vercel Staging
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./web
          scope: enterprise-attendance
