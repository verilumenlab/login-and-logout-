# WorkPulse backend on Render (Blueprint). Web portal is on Vercel, employee app is the desktop installer.
# Render dashboard > New > Blueprint > pick this repo. You will be asked for the values marked sync: false.
#
# Plans: "free" works for testing, but a free web service sleeps after 15 idle minutes (first request then takes
# ~1 minute and the Friday report can be missed) and a free database expires after 30 days.
# For real use switch the web service to "starter" and the database to "basic-256mb".

services:
  - type: web
    name: workpulse-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh scripts/render-start.sh
    healthCheckPath: /api/v1/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: workpulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: workpulse-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: workpulse-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: workpulse-redis
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: '["https://login-and-logout-ef7g-support-55072731.vercel.app","http://localhost:3000","http://127.0.0.1:3000","tauri://localhost","http://tauri.localhost","https://tauri.localhost","http://localhost:1420"]'
      - key: BACKEND_CORS_ORIGIN_REGEX
        value: ^https://login-and-logout-ef7g(-[a-z0-9]+)*\.vercel\.app$
      - key: FRONTEND_BASE_URL
        value: https://login-and-logout-ef7g-support-55072731.vercel.app
      - key: FORWARDED_ALLOW_IPS
        value: "*" # Render only exposes the service through its proxy
      # First-run setup (app/bootstrap.py): creates the organization and the first administrator.
      - key: BOOTSTRAP_ORG_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Welcome emails (User ID + password) and Friday reports.
      # Set in the Render dashboard (do not leave EMAIL_PROVIDER=console for real inbox delivery):
      # EMAIL_PROVIDER=smtp, SMTP_HOST=smtp.gmail.com, SMTP_PORT=587, SMTP_TLS=true,
      # SMTP_USER, SMTP_PASSWORD (Google App Password), DEFAULT_FROM_EMAIL
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_TLS
        sync: false
      - key: SMTP_SSL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DEFAULT_FROM_NAME
        sync: false
      - key: WEEKLY_REPORT_HR_EMAILS
        value: satish@verilumen.ai
      - key: WEEKLY_REPORT_MANAGER_EMAILS
        value: kp@verilumen.ai

  - type: keyvalue
    name: workpulse-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: [] # internal connections only

databases:
  - name: workpulse-db
    plan: free
    region: singapore
    databaseName: workpulse
    user: workpulse
